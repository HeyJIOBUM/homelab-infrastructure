services_path: /srv/homelab/homelab-infrastructure

# ansible
ansible_venv_path: /opt/ansible-venv
ansible_python_interpreter: "{{ ansible_venv_path }}/bin/python"

# step_ca
step_ca_system_ca_path: "/usr/local/share/ca-certificates/homelab-root-ca.crt"

step_ca_api_port: 9000
step_ca_ip: "{{ hostvars['vps1'].ansible_host }}"
step_ca_addr: "{{ vault_proto }}://{{ step_ca_ip }}:{{ step_ca_api_port }}"

# vault
ansible_hashi_vault_ca_cert: "{{ step_ca_system_ca_path }}"

vault_kv_engine: "secret"

vault_tls_disable: "false"
vault_proto: "{{ 'http' if vault_tls_disable | bool else 'https' }}"

vault_port: 8200
vault_ip: "{{ hostvars['vps1'].ansible_host }}"
vault_addr: "{{ vault_proto }}://{{ vault_ip }}:{{ vault_port }}"

