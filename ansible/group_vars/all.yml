services_path: /srv/homelab/homelab-infrastructure

# ansible
ansible_venv_path: /opt/ansible-venv
ansible_python_interpreter: "{{ ansible_venv_path }}/bin/python"

# step_ca
step_ca_system_ca_path: "/usr/local/share/ca-certificates/homelab-root-ca.crt"

step_ca_api_port: 9000
step_ca_ip: "{{ hostvars['vps1'].ansible_host }}"
step_ca_addr: "https://{{ step_ca_ip }}:{{ step_ca_api_port }}"

# vault
ansible_hashi_vault_ca_cert: "{{ step_ca_system_ca_path }}"

vault_kv_engine: "secret"

vault_tls_disable: "false"
vault_proto: "{{ 'http' if vault_tls_disable | bool else 'https' }}"

vault_port: 8200
vault_ip: "{{ hostvars['vps1'].ansible_host }}"
vault_addr: "{{ vault_proto }}://{{ vault_ip }}:{{ vault_port }}"

vault_admin_password: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  61373234393761623263383137356434383132643030356364623462326137323530373066663738
  3264643434353836666136333230353038316162386435620a363135633364616431386662643033
  65666137363332393865636462623535633639626436373834616433666437346137363230353961
  3333363966646438350a316362353532393333633365666266356136386534656337386531303865
  66333861323863643638663563393639663138623661306361613565663033356136

# traefik
traefik_docker_network: "traefik"
traefik_network_subnet: "172.21.0.0/16"
traefik_network_gateway: "172.21.0.1"

traefik_ip: "{{ hostvars['vps1'].ansible_host }}"
traefik_addr: "https://{{ traefik_ip }}"

# technitium
technitium_dns_zone: "homelab"

technitium_docker_ip: "172.21.0.10"

technitium_api_port: "5380"
technitium_ip: "{{ hostvars['vps1'].ansible_host }}"
technitium_addr: "http://{{ technitium_ip }}:{{ technitium_api_port }}"

# zabbix
zabbix_postgress_port: "5432"

zabbix_web_port: "5050"
zabbix_ip: "{{ hostvars['vps1'].ansible_host }}"
zabbix_addr: "http://{{ zabbix_ip }}:{{ zabbix_web_port }}"