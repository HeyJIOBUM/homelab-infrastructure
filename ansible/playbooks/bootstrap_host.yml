- name: Bootstrap host for ansible
  hosts: all
  become: true

  vars:
    ansible_python_interpreter: /usr/bin/python3.12

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - openssl
          - gnupg
          - curl
          - jq
          - python3
          - python3-pip
          - python3-venv
        state: present

    - name: Create Ansible venv
      command:
        cmd: "{{ ansible_python_interpreter }} -m venv {{ ansible_venv_path }}"
        creates: "{{ ansible_venv_path }}/bin/python"

    - name: Upgrade pip in venv
      pip:
        name: pip
        state: latest
        virtualenv: "{{ ansible_venv_path }}"

    - name: Install Python dependencies for Ansible modules
      pip:
        name:
          - hvac
          - requests
          - jmespath
          - packaging
        state: present
        virtualenv: "{{ ansible_venv_path }}"

    - name: Configure Docker daemon
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "userland-proxy": true
          }
        owner: root
        group: root
        mode: "0644"
      notify: Restart docker

    - name: Ensure Docker service is enabled and started
      service:
        name: docker
        state: started
        enabled: true

  handlers:
    - name: Restart docker
      service:
        name: docker
        state: restarted