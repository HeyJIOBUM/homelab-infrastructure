# Deploy all homelab services
#
# Order:
#   1. step_ca
#   2. vault
#   3. technitium
#   4. dnsweaver
#   5. traefik
#   6. homepage
#   7. garage
#   8. ittools
#   9. apprise
#   10. zabbix
#   11. syncthing
#   12. restfox
#   13. bytestash
#   14. amneziawg

- name: Deploy step_ca
  import_playbook: step_ca/deploy.yml

# requires ansible vault unseal for vault_admin_password
- name: Deploy vault
  import_playbook: vault/deploy.yml

- name: Init servicies secrets
  import_playbook: vault/init_services_secrets.yml

- name: Deploy technitium
  import_playbook: technitium/deploy.yml

- name: Deploy dnsweaver
  import_playbook: dnsweaver/deploy.yml

- name: Deploy traefik
  import_playbook: traefik/deploy.yml

- name: Deploy homepage
  import_playbook: homepage/deploy.yml

- name: Deploy garage
  import_playbook: garage/deploy.yml

- name: Deploy ittools
  import_playbook: ittools/deploy.yml

- name: Deploy apprise
  import_playbook: apprise/deploy.yml

- name: Deploy zabbix
  import_playbook: zabbix/deploy.yml

- name: Deploy syncthing
  import_playbook: syncthing/deploy.yml

- name: Deploy restfox
  import_playbook: restfox/deploy.yml

- name: Deploy bytestash
  import_playbook: bytestash/deploy.yml

- name: Deploy amneziawg
  import_playbook: amneziawg/deploy.yml