- name: Add service to Vault
  hosts: all
  become: yes
  
  environment:
    VAULT_ADDR: "{{ vault_addr }}"

  vars_files:
    - vault_vars.yml

  pre_tasks:
    - name: Validate required variables
      assert:
        that:
          - service_name is defined
          - service_name | length > 0
        fail_msg: >-
          "service_name" is required. Usage:
          ansible-playbook playbooks/vault/add_service.yml -e "service_name=sync"
        quiet: true

  roles:
    - role: vault_add_service