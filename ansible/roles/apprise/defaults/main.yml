# Dirs
apprise_service_dir: "{{ services_path }}/apprise"
apprise_config_dir: "{{ apprise_service_dir }}/config"
apprise_attach_dir: "{{ apprise_service_dir }}/attach"
apprise_plugin_dir: "{{ apprise_service_dir }}/plugin"

# config
apprise_tag: "2.0.1"

apprise_host_port: "8000"

apprise_user: "1000"
apprise_group: "1000"

# Notify
apprise_default_url: "{{ apprise_tg_bot_path }}"
apprise_default_configurations:
  - config_id: "zabbix_admin"
    urls: []

# vault
encrypted_apprise_tg_bot_path: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  38326664376136353866353936346530613730643362393332623636343436646539323063636266
  6362653666356634326239333366396362363763613064650a316464626536326563366535623431
  65393730376230616538373239346162333164346637623433636630656234346334343532343833
  3732633035313061370a356638363132343636646230346264663833626333623631373432316362
  63333062306132303866663631313331343835313664346632396466653631373536316238636530
  63323762326465633739363536633663366232323034363438313035373736633963333565316661
  35393764616238316438356162653962613531653665656233626164393334643261656636346438
  32653135643839663635

apprise_vault_path: infra/apprise
apprise_vault_secrets:
  - ansible_name: apprise_admin_password
    vault_name: admin_password
    generator: "{{ lookup('pipe', 'openssl rand -hex 32') }}"
  - ansible_name: apprise_tg_bot_path
    vault_name: tg_bot_path
    generator: !unsafe "{{ lookup('vars', 'encrypted_apprise_tg_bot_path') }}"