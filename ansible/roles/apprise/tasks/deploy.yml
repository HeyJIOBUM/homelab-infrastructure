- name: Login to vault
  include_role:
    name: vault
    tasks_from: login
  tags: always

- name: Get apprise secrets
  include_role:
    name: apprise
    tasks_from: read_vault_secrets
  tags: always

- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ apprise_service_dir }}"

- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ apprise_user }}"
    group: "{{ apprise_group }}"
    mode: "0755"
  loop:
    - "{{ apprise_config_dir }}"
    - "{{ apprise_attach_dir }}"
    - "{{ apprise_plugin_dir }}"

- name: Create Docker Compose
  template:
    src: docker-compose.yml.j2
    dest: "{{ apprise_service_dir }}/docker-compose.yml"
    mode: "0644"

- name: Start apprise container
  community.docker.docker_compose_v2:
    project_src: "{{ apprise_service_dir }}"
    state: present

- name: Add apprise configurations
  uri:
    url: "{{ apprise_addr }}/add/{{ apprise_config.config_id }}"
    method: POST
    url_username: "admin"
    url_password: "{{ apprise_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      urls: "{{ apprise_config.urls | join(',') | default(apprise_default_url, true) }}"
    status_code: 200
  no_log: true
  loop: "{{ apprise_default_configurations }}"
  loop_control:
    loop_var: apprise_config
    label: "{{ apprise_config.config_id }}"