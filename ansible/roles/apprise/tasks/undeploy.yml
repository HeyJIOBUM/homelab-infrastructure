- name: Check if apprise compose file exists
  stat:
    path: "{{ apprise_service_dir }}/docker-compose.yml"
  register: apprise_compose

- name: Stop apprise container
  community.docker.docker_compose_v2:
    project_src: "{{ apprise_service_dir }}"
    state: absent
  when:
    - undeploy_levels[undeploy_level] >= undeploy_levels.stop
    - apprise_compose.stat.exists

- name: Remove apprise service directory
  file:
    path: "{{ apprise_service_dir }}"
    state: absent
  when: undeploy_levels[undeploy_level] >= undeploy_levels.wipe