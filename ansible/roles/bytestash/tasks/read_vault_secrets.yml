- name: Read bytestash secrets from vault
  include_role:
    name: vault
    tasks_from: init_services_secrets_templates/read_init_secrets
  vars:
    vault_log_service_name: "bytestash"
    vault_service_secrets_path: "{{ bytestash_vault_path }}"
    vault_service_secrets: "{{ bytestash_vault_secrets }}"