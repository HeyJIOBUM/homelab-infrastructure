- name: Check if bytestash compose file exists
  stat:
    path: "{{ bytestash_service_dir }}/docker-compose.yml"
  register: bytestash_compose

- name: Stop bytestash container
  community.docker.docker_compose_v2:
    project_src: "{{ bytestash_service_dir }}"
    state: absent
  when:
    - undeploy_levels[undeploy_level] >= undeploy_levels.stop
    - bytestash_compose.stat.exists

- name: Remove bytestash service directory
  file:
    path: "{{ bytestash_service_dir }}"
    state: absent
  when: undeploy_levels[undeploy_level] >= undeploy_levels.wipe