- name: Check if garage secrets already exist
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    engine_mount_point: "{{ vault_kv_engine }}"
    path: "{{ garage_vault_path }}"
  register: garage_secrets
  failed_when: false
  no_log: true

- name: Generate and write garage secrets if missing
  community.hashi_vault.vault_kv2_write:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    engine_mount_point: "{{ vault_kv_engine }}"
    path: "{{ garage_vault_path }}"
    data:
      rpc_secret: "{{ lookup('pipe', 'openssl rand -hex 32') }}"
      admin_token: "{{ lookup('pipe', 'openssl rand -hex 32') }}"
  when: garage_secrets.data is not defined
  no_log: true