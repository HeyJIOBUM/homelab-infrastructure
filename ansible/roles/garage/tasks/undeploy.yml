- name: Check if garage compose file exists
  stat:
    path: "{{ garage_service_dir }}/docker-compose.yml"
  register: garage_compose

- name: Stop garage container
  community.docker.docker_compose_v2:
    project_src: "{{ garage_service_dir }}"
    state: absent
  when:
    - undeploy_levels[undeploy_level] >= undeploy_levels.stop
    - garage_compose.stat.exists

- name: Remove garage service directory
  file:
    path: "{{ garage_service_dir }}"
    state: absent
  when: undeploy_levels[undeploy_level] >= undeploy_levels.wipe