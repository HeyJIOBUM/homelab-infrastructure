- name: Check if homepage compose file exists
  stat:
    path: "{{ homepage_service_dir }}/docker-compose.yml"
  register: homepage_compose

- name: Stop homepage container
  community.docker.docker_compose_v2:
    project_src: "{{ homepage_service_dir }}"
    state: absent
  when:
    - undeploy_levels[undeploy_level] >= undeploy_levels.stop
    - homepage_compose.stat.exists

- name: Remove homepage service directory
  file:
    path: "{{ homepage_service_dir }}"
    state: absent
  when: undeploy_levels[undeploy_level] >= undeploy_levels.wipe