- name: Login to vault
  include_role:
    name: vault
    tasks_from: login

- name: Get hoppscotch secrets
  include_role:
    name: hoppscotch
    tasks_from: read_vault_secrets

- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ hoppscotch_service_dir }}"
    - "{{ hoppscotch_data_dir }}"

- name: Create Docker Compose
  template:
    src: docker-compose.yml.j2
    dest: "{{ hoppscotch_service_dir }}/docker-compose.yml"
    mode: "0644"

- name: Start hoppscotch container
  community.docker.docker_compose_v2:
    project_src: "{{ hoppscotch_service_dir }}"
    state: present

- name: Run hoppscotch database migration
  shell: |
    cd {{ hoppscotch_service_dir }} && 
    docker compose run --rm hoppscotch pnpm exec prisma migrate deploy
  register: hoppscotch_migrate