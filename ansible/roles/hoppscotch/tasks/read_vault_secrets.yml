- name: Read hoppscotch secrets
  include_role:
    name: vault
    tasks_from: init_services_secrets_templates/read_init_secrets
  vars:
    vault_log_service_name: "hoppscotch"
    vault_service_secrets_path: "{{ hoppscotch_vault_path }}"
    vault_service_secrets: "{{ hoppscotch_vault_secrets }}"