- name: Check if hoppscotch compose file exists
  stat:
    path: "{{ hoppscotch_service_dir }}/docker-compose.yml"
  register: hoppscotch_compose

- name: Stop hoppscotch container
  community.docker.docker_compose_v2:
    project_src: "{{ hoppscotch_service_dir }}"
    state: absent
  when:
    - undeploy_levels[undeploy_level] >= undeploy_levels.stop
    - hoppscotch_compose.stat.exists

- name: Remove hoppscotch service directory
  file:
    path: "{{ hoppscotch_service_dir }}"
    state: absent
  when: undeploy_levels[undeploy_level] >= undeploy_levels.wipe