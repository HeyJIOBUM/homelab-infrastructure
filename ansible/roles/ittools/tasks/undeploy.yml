- name: Check if ittools compose file exists
  stat:
    path: "{{ ittools_service_dir }}/docker-compose.yml"
  register: ittools_compose

- name: Stop ittools container
  community.docker.docker_compose_v2:
    project_src: "{{ ittools_service_dir }}"
    state: absent
  when:
    - undeploy_levels[undeploy_level] >= undeploy_levels.stop
    - ittools_compose.stat.exists

- name: Remove ittools service directory
  file:
    path: "{{ ittools_service_dir }}"
    state: absent
  when: undeploy_levels[undeploy_level] >= undeploy_levels.wipe