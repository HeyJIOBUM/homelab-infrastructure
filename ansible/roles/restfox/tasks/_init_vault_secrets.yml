- name: Init restfox secrets in vault
  include_role:
    name: vault
    tasks_from: init_services_secrets_templates/generate_init_secrets
  vars:
    vault_log_service_name: "restfox"
    vault_service_secrets_path: "{{ restfox_vault_path }}"
    vault_service_secrets: "{{ restfox_vault_secrets }}"