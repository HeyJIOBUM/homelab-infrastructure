- name: Check if restfox compose file exists
  stat:
    path: "{{ restfox_service_dir }}/docker-compose.yml"
  register: restfox_compose

- name: Stop restfox container
  community.docker.docker_compose_v2:
    project_src: "{{ restfox_service_dir }}"
    state: absent
  when:
    - undeploy_levels[undeploy_level] >= undeploy_levels.stop
    - restfox_compose.stat.exists

- name: Remove restfox service directory
  file:
    path: "{{ restfox_service_dir }}"
    state: absent
  when: undeploy_levels[undeploy_level] >= undeploy_levels.wipe