- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ step_ca_service_dir }}"
    - "{{ step_ca_credentials_dir }}"

- name: Create step-ca data dir
  file:
    path: "{{ step_ca_data_dir }}"
    state: directory
    mode: "0700"
    owner: 1000
    group: 1000

- name: Check if init password already exists
  stat:
    path: "{{ step_ca_init_password_file }}"
  register: step_ca_pass_stat

- name: Generate init password if missing
  copy:
    content: "{{ lookup('pipe', 'openssl rand -hex 32') }}\n"
    dest: "{{ step_ca_init_password_file }}"
    mode: "0600"
    owner: 1000
    group: 1000
  when: not step_ca_pass_stat.stat.exists
  no_log: true

- name: Ensure traefik network exists
  community.docker.docker_network:
    name: "{{ traefik_docker_network }}"
    state: present

- name: Create Docker Compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ step_ca_service_dir }}/docker-compose.yml"
    mode: "0644"

- name: Start Step-CA container
  community.docker.docker_compose_v2:
    project_src: "{{ step_ca_service_dir }}"
    state: present

- name: Wait for Step-CA to be ready
  uri:
    url: "https://localhost:{{ step_ca_api_port }}/health"
    validate_certs: false
    status_code: 200
  register: step_ca_health
  until: step_ca_health.status == 200
  retries: 30
  delay: 2
  changed_when: false

- name: Wait for root_ca.crt to appear
  wait_for:
    path: "{{ step_ca_data_dir }}/certs/root_ca.crt"
    timeout: 30

- name: Copy root CA certificate to credentials dir
  copy:
    src: "{{ step_ca_data_dir }}/certs/root_ca.crt"
    dest: "{{ step_ca_root_ca_file }}"
    mode: "0644"
    remote_src: true

- name: Copy intermediate CA certificate to credentials dir
  copy:
    src: "{{ step_ca_data_dir }}/certs/intermediate_ca.crt"
    dest: "{{ step_ca_intermediate_ca_file }}"
    mode: "0644"
    remote_src: true