- name: Read syncthing secrets from vault
  include_role:
    name: vault
    tasks_from: init_services_secrets_templates/read_init_secrets
  vars:
    vault_log_service_name: "syncthing"
    vault_service_secrets_path: "{{ syncthing_vault_path }}"
    vault_service_secrets: "{{ syncthing_vault_secrets }}"