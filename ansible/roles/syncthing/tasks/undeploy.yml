- name: Check if syncthing compose file exists
  stat:
    path: "{{ syncthing_service_dir }}/docker-compose.yml"
  register: syncthing_compose

- name: Stop syncthing container
  community.docker.docker_compose_v2:
    project_src: "{{ syncthing_service_dir }}"
    state: absent
  when:
    - undeploy_levels[undeploy_level] >= undeploy_levels.stop
    - syncthing_compose.stat.exists

- name: Remove syncthing service directory
  file:
    path: "{{ syncthing_service_dir }}"
    state: absent
  when: undeploy_levels[undeploy_level] >= undeploy_levels.wipe