- name: Check if technitium compose file exists
  stat:
    path: "{{ technitium_service_dir }}/docker-compose.yml"
  register: technitium_compose

- name: Stop technitium container
  community.docker.docker_compose_v2:
    project_src: "{{ technitium_service_dir }}"
    state: absent
  when:
    - undeploy_levels[undeploy_level] >= undeploy_levels.stop
    - technitium_compose.stat.exists

- name: Remove technitium service directory
  file:
    path: "{{ technitium_service_dir }}"
    state: absent
  when: undeploy_levels[undeploy_level] >= undeploy_levels.wipe

- name: Restore system dns configuration
  when: undeploy_levels[undeploy_level] >= undeploy_levels.restore
  block:
    - name: Check if /etc/resolv.conf is immutable
      command: lsattr /etc/resolv.conf
      register: technitium_lsattr_check
      changed_when: false
      failed_when: false

    - name: Remove immutable flag from /etc/resolv.conf
      command: chattr -i /etc/resolv.conf
      when: "'i' in technitium_lsattr_check.stdout"
      changed_when: true

    - name: Remove /etc/resolv.conf
      file:
        path: /etc/resolv.conf
        state: absent

    - name: Check if systemd-resolved is available
      command: systemctl list-unit-files systemd-resolved.service
      register: technitium_resolved_available
      changed_when: false
      failed_when: false

    - name: Re-enable and start systemd-resolved
      systemd:
        name: systemd-resolved
        state: started
        enabled: true
      when: technitium_resolved_available.rc == 0

    - name: Restore /etc/resolv.conf symlink to systemd-resolved stub
      file:
        src: /run/systemd/resolve/stub-resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true
      when: technitium_resolved_available.rc == 0

    - name: Restart systemd-resolved
      systemd:
        name: systemd-resolved
        state: restarted
      when: technitium_resolved_available.rc == 0