# Dirs
traefik_service_dir: "{{ services_path }}/traefik"
traefik_config_dir: "{{ traefik_service_dir }}/config"
traefik_credentials_dir: "{{ traefik_service_dir }}/credentials"

# config
traefik_tag: "v3.7"

traefik_ca_acme_duration: 720

# vault
traefik_vault_path: infra/traefik
traefik_vault_secrets:
  - ansible_name: traefik_admin_password
    vault_name: admin_password
    generator: "{{ lookup('pipe', 'openssl rand -hex 32') }}"