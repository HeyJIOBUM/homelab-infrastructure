- name: Check if traefik compose file exists
  stat:
    path: "{{ traefik_service_dir }}/docker-compose.yml"
  register: traefik_compose

- name: Stop traefik container
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_service_dir }}"
    state: absent
  when:
    - undeploy_levels[undeploy_level] >= undeploy_levels.stop
    - traefik_compose.stat.exists

- name: Remove traefik service directory
  file:
    path: "{{ traefik_service_dir }}"
    state: absent
  when: undeploy_levels[undeploy_level] >= undeploy_levels.wipe