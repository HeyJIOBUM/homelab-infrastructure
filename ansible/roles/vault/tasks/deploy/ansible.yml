- name: Check if ansible-admin policy exists
  shell: |
    docker exec -e VAULT_TOKEN={{ vault_token }} vault \
      vault policy read ansible-admin >/dev/null 2>&1 && echo "exists" || echo "missing"
  register: ansible_policy_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Create admin policy for Ansible
  shell: |
    echo '{{ ansible_admin_policy }}' | \
      docker exec -i -e VAULT_TOKEN={{ vault_token }} vault \
      vault policy write ansible-admin -
  vars:
    ansible_admin_policy: |
      # policies
      path "sys/policies/acl/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }

      # approle
      path "auth/approle/role/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }
      path "auth/approle/role/*/role-id" {
        capabilities = ["read"]
      }
      path "auth/approle/role/*/secret-id" {
        capabilities = ["create", "update"]
      }

      # secrets
      path "{{ vault_kv_engine }}/data/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }
      path "{{ vault_kv_engine }}/metadata/*" {
        capabilities = ["read", "list", "delete"]
      }

      # self token renew
      path "auth/token/renew-self" {
        capabilities = ["update"]
      }
      path "auth/token/lookup-self" {
        capabilities = ["read"]
      }
  register: ansible_policy
  when: "'exists' not in ansible_policy_check.stdout"
  changed_when: "'Success' in ansible_policy.stdout"
  no_log: true

- name: Check if ansible AppRole exists
  shell: |
    docker exec -e VAULT_TOKEN={{ vault_token }} vault \
      vault read auth/approle/role/ansible >/dev/null 2>&1 && echo "exists" || echo "missing"
  register: ansible_approle_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Create AppRole for Ansible
  shell: |
    docker exec -e VAULT_TOKEN={{ vault_token }} vault \
      vault write auth/approle/role/ansible \
      secret_id_ttl={{ ansible_secret_id_ttl }} \
      token_ttl={{ ansible_token_ttl }} \
      token_max_ttl={{ ansible_token_max_ttl }} \
      policies=ansible-admin
  register: ansible_approle
  when: "'exists' not in ansible_approle_check.stdout"
  changed_when: "'Success' in ansible_approle.stdout or 'created' in ansible_approle.stdout"
  no_log: true

- name: Get Ansible Role ID
  shell: |
    docker exec -e VAULT_TOKEN={{ vault_token }} vault \
      vault read -field=role_id auth/approle/role/ansible/role-id
  register: ansible_role_id
  changed_when: false
  no_log: true

- name: Get Ansible Secret ID
  shell: |
    docker exec -e VAULT_TOKEN={{ vault_token }} vault \
      vault write -f -field=secret_id auth/approle/role/ansible/secret-id
  register: ansible_secret_id
  changed_when: false
  no_log: true

- name: Save Ansible AppRole credentials
  copy:
    content: |
      # Ansible AppRole credentials
      # Generated: {{ ansible_facts.date_time.iso8601 }}
      #
      # Next:
      # - use commands
      # - set password
      # - save in all.yml
      #
      ansible-vault encrypt_string '{{ ansible_role_id.stdout }}' --name 'vault_ansible_role_id'
      ansible-vault encrypt_string '{{ ansible_secret_id.stdout }}' --name 'vault_ansible_secret_id'
    dest: "{{ vault_ansible_creds_file }}"
    mode: "0600"
  no_log: true