- name: "[{{ vault_log_service_name }}] Validate required params"
  assert:
    that:
      - vault_log_service_name | length > 0
      - vault_token | length > 0
      - vault_service_secrets_path | length > 0
      - vault_service_secrets is iterable
      - vault_service_secrets | length > 0
      - vault_service_secrets | selectattr('vault_name', 'undefined') | length == 0
      - vault_service_secrets | selectattr('ansible_name', 'undefined') | length == 0
      - vault_service_secrets | selectattr('generator', 'undefined') | length == 0
    fail_msg: >-
      vault_service_secrets_path is required, vault_service_secrets must be array of {vault_name: "", ansible_name: "", generator: ""}

- name: "[{{ vault_log_service_name }}] Read secrets from vault"
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_addr }}"
    ca_cert: "{{ step_ca_system_ca_path }}"
    token: "{{ vault_token }}"
    engine_mount_point: "{{ vault_kv_engine }}"
    path: "{{ vault_service_secrets_path }}"
  delegate_to: vps1
  register: vault_fetched_secrets
  failed_when: false
  when: vault_force_secrets_creation == false
  no_log: true

- name: "[{{ vault_log_service_name }}] Calculate vault data if needed"
  when: vault_force_secrets_creation == true or vault_fetched_secrets.data is not defined
  block:
    - name: "[{{ vault_log_service_name }}] Create temp templates for jinja generators"
      copy:
        content: "{{ vault_secret_item.generator }}"
        dest: "/tmp/vault_gen_{{ vault_log_service_name }}_{{ vault_secret_item.ansible_name }}.j2"
        mode: "0644"
      delegate_to: localhost
      loop: "{{ vault_service_secrets }}"
      loop_control:
        label: "{{ vault_secret_item.ansible_name }}"
        loop_var: vault_secret_item
      when: vault_secret_item.generator is match('^\{\{.*\}\}$')
      no_log: true

    - name: "[{{ vault_log_service_name }}] Resolve vault values"
      set_fact:
        vault_secrets_data: >-
          {{
            vault_secrets_data | default({})
            | combine({
                vault_secret_item.vault_name: (
                  lookup('template', '/tmp/vault_gen_' ~ vault_log_service_name ~ '_' ~ vault_secret_item.ansible_name ~ '.j2')
                  if (vault_secret_item.generator is match('^\{\{.*\}\}$'))
                  else vault_secret_item.generator
                )
              })
          }}
      delegate_to: localhost
      loop: "{{ vault_service_secrets }}"
      loop_control:
        label: "{{ vault_secret_item.ansible_name }}"
        loop_var: vault_secret_item
      no_log: true

    - name: "[{{ vault_log_service_name }}] Remove temp templates"
      file:
        path: "/tmp/vault_gen_{{ vault_log_service_name }}_{{ vault_secret_item.ansible_name }}.j2"
        state: absent
      delegate_to: localhost
      loop: "{{ vault_service_secrets }}"
      loop_control:
        label: "{{ vault_secret_item.ansible_name }}"
        loop_var: vault_secret_item
      when: vault_secret_item.generator is match('^\{\{.*\}\}$', multiline=False)
      no_log: true

    - name: "[{{ vault_log_service_name }}] Write vault values"
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        ca_cert: "{{ step_ca_system_ca_path }}"
        token: "{{ vault_token }}"
        engine_mount_point: "{{ vault_kv_engine }}"
        path: "{{ vault_service_secrets_path }}"
        data: "{{ vault_secrets_data }}"
      delegate_to: vps1
      no_log: true