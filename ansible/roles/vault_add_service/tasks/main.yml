- name: Get root token
  slurp:
    src: "{{ vault_root_token_file }}"
  register: root_token_data

- name: Set vault token
  set_fact:
    vault_token: "{{ root_token_data.content | b64decode | trim }}"

- name: Create policy for service in each environment
  shell: |
    echo '{{ service_policy_rules }}' | \
      docker exec -i -e VAULT_TOKEN={{ vault_token }} vault \
      vault policy write {{ service_name }}-{{ item }} -
  vars:
    service_policy_rules: |
      # {{ item }} environment only
      path "{{ vault_kv_engine }}/data/{{ item }}/services/{{ service_name }}/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }
      path "{{ vault_kv_engine }}/metadata/{{ item }}/services/{{ service_name }}/*" {
        capabilities = ["read", "list"]
      }

      # Token renewal
      path "auth/token/renew-self" {
        capabilities = ["update"]
      }
  loop: "{{ service_envs }}"
  loop_control:
    label: "{{ service_name }}-{{ item }}"
  register: policy_result
  changed_when: "'Success' in policy_result.stdout"

- name: Create AppRole for service in each environment
  shell: |
    docker exec -e VAULT_TOKEN={{ vault_token }} vault \
      vault write auth/approle/role/{{ service_name }}-{{ item }} \
      secret_id_ttl={{ service_secret_ttl }} \
      token_ttl={{ service_token_ttl }} \
      token_max_ttl={{ service_token_max_ttl }} \
      policies={{ service_name }}-{{ item }}
  loop: "{{ service_envs }}"
  loop_control:
    label: "{{ service_name }}-{{ item }}"
  register: approle_result
  changed_when: "'Success' in approle_result.stdout or 'created' in approle_result.stdout"

- name: Initialize service path in Vault
  shell: |
    docker exec -e VAULT_TOKEN={{ vault_token }} vault \
      vault kv put -format=json {{ vault_kv_engine }}/{{ item }}/services/{{ service_name }} \
      service_name="{{ service_name }}" \
      environment="{{ item }}"
  loop: "{{ service_envs }}"
  loop_control:
    label: "{{ item }}/services/{{ service_name }}"
  register: secret_result

- name: Get Role ID for service in each environment
  shell: |
    docker exec -e VAULT_TOKEN={{ vault_token }} vault \
      vault read -field=role_id auth/approle/role/{{ service_name }}-{{ item }}/role-id
  loop: "{{ service_envs }}"
  loop_control:
    label: "{{ service_name }}-{{ item }}"
  register: role_id_results
  changed_when: false

- name: Get Secret ID for service in each environment
  shell: |
    docker exec -e VAULT_TOKEN={{ vault_token }} vault \
      vault write -f -field=secret_id auth/approle/role/{{ service_name }}-{{ item }}/secret-id
  loop: "{{ service_envs }}"
  loop_control:
    label: "{{ service_name }}-{{ item }}"
  register: secret_id_results
  changed_when: false

- name: Create credentials directory
  file:
    path: "{{ vault_credentials_dir }}"
    state: directory
    mode: 0755

- name: Save credentials for each environment
  copy:
    content: |
      # Vault AppRole credentials for {{ service_name }}
      # Environment: {{ item }}
      # Generated: {{ ansible_facts.date_time.iso8601 }}

      # Vault connection settings
      VAULT_ADDR="{{ vault_addr }}"
      VAULT_ROLE_ID="{{ role_id_results.results[ansible_loop.index0].stdout }}"
      VAULT_SECRET_ID="{{ secret_id_results.results[ansible_loop.index0].stdout }}"
      VAULT_APPROLE_MOUNT="approle"

      # Vault paths
      VAULT_KV_ENGINE="{{ vault_kv_engine }}"
      VAULT_SECRET_PATH="{{ vault_kv_engine }}/data/{{ item }}/services/{{ service_name }}"

      # Usage:
      # source {{ vault_credentials_dir }}/{{ service_name }}.{{ item }}.env
      # vault write auth/approle/login role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID"
    dest: "{{ vault_credentials_dir }}/{{ service_name }}.{{ item }}.env"
    mode: "0600"
  loop: "{{ service_envs }}"
  loop_control:
    label: "{{ service_name }}.{{ item }}.env"