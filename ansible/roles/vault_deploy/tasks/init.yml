- name: Check if Vault is initialized
  shell: |
    docker exec vault vault status -format=json 2>/dev/null | jq -r '.initialized' || echo "false"
  register: vault_initialized
  changed_when: false
  failed_when: false

- name: Initialize Vault
  shell: |
    docker exec vault vault operator init \
      -key-shares={{ vault_key_shares }} \
      -key-threshold={{ vault_key_threshold }} \
      -format=json > {{ vault_credentials_file }}
  when: vault_initialized.stdout == "false"
  register: init_output

- name: Get root token from credentials file
  shell: |
    cat {{ vault_credentials_file }} | jq -r '.root_token'
  register: root_token
  when: vault_initialized.stdout == "false"

- name: Save root token to file
  copy:
    content: "{{ root_token.stdout }}"
    dest: "{{ vault_root_token_file }}"
    mode: 0600
  when: vault_initialized.stdout == "false"