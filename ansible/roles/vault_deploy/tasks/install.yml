- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    mode: 0755
  loop:
    - "{{ vault_service_dir }}"
    - "{{ vault_config_dir }}"
    - "{{ vault_credentials_dir }}"

- name: Create vault data dir
  file:
    path: "{{ vault_data_dir }}"
    state: directory
    mode: 0755
    owner: 100
    group: 100

- name: Create vault config
  template:
    src: vault.hcl.j2
    dest: "{{ vault_config_dir }}/vault.hcl"
    mode: 0644
    owner: 100
    group: 100

- name: Create Docker Compose
  template:
    src: docker-compose.yml.j2
    dest: "{{ vault_service_dir }}/docker-compose.yml"
    mode: 0644

- name: Start Vault container
  community.docker.docker_compose_v2:
    project_src: "{{ vault_service_dir }}"
    state: present

- name: Wait for Vault to be ready
  uri:
    url: "{{ vault_addr }}/v1/sys/health"
    status_code: 200, 501
  register: health
  until: health.status in [200, 501]
  retries: 30
  delay: 2