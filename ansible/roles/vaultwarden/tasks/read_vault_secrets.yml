- name: Read vaultwarden secrets from vault
  include_role:
    name: vault
    tasks_from: init_services_secrets_templates/read_init_secrets
  vars:
    vault_log_service_name: "vaultwarden"
    vault_service_secrets_path: "{{ vaultwarden_vault_path }}"
    vault_service_secrets: "{{ vaultwarden_vault_secrets }}"