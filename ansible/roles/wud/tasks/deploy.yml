- name: Login to vault
  include_role:
    name: vault
    tasks_from: login
  tags: always

- name: Get wud secrets
  include_role:
    name: wud
    tasks_from: read_vault_secrets
  tags: always


- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ wud_service_dir }}"
    - "{{ wud_data_dir }}"

- name: Create Docker Compose
  template:
    src: docker-compose.yml.j2
    dest: "{{ wud_service_dir }}/docker-compose.yml"
    mode: "0644"

- name: Start wud container
  community.docker.docker_compose_v2:
    project_src: "{{ wud_service_dir }}"
    state: present