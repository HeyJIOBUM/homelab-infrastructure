- name: Download Zabbix repository package
  get_url:
    url: "https://repo.zabbix.com/zabbix/{{ zabbix_version }}/release/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_{{ zabbix_version }}+ubuntu24.04_all.deb"
    dest: /tmp/zabbix-release.deb
    mode: "0644"

- name: Install Zabbix repository package
  apt:
    deb: /tmp/zabbix-release.deb
    state: present
    force: true

- name: Update apt cache
  apt:
    update_cache: true

- name: Install zabbix-agent2 with plugins
  apt:
    name: 
      - zabbix-agent2
      - zabbix-agent2-plugin-postgresql
    state: present

- name: Create zabbix-agent2 custom configuration
  copy:
    dest: /etc/zabbix/zabbix_agent2.d/custom.conf
    content: |
      # Managed by Ansible
      Server={{ traefik_network_subnet }}
      Hostname={{ zabbix_default_hostname }}
      ListenIP={{ traefik_network_gateway }}
    mode: "0644"
  notify: restart zabbix-agent2

- name: Enable and start zabbix-agent2
  systemd:
    name: zabbix-agent2
    state: restarted
    enabled: true