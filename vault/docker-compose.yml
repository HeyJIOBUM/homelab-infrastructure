services:
  vault:
    image: hashicorp/vault:2.1.0
    container_name: vault
    restart: unless-stopped
    
    cap_add:
      - IPC_LOCK
    
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
      - VAULT_CLUSTER_ADDR=http://127.0.0.1:8201
    
    ports:
      - "8200:8200"
    
    volumes:
      - ./config:/vault/config:ro
      - ./scripts:/vault/scripts:ro
      - ./data:/vault/data
    
    command: server